# HIVE pod'larinin /metrics'i (ayri port 9090, ALB'ye acik degil).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: hive
  namespace: hive
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hive
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
