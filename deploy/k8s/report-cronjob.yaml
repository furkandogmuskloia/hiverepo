# Eski sunucudaki report.sh'in (root cron, */10) yerini alir: daily_reports'a
# urun sayisi ve toplam stok ozeti yazar; /api/reports bunu okur.
#
# Cutover 2026-09-25 tamamlandi; trafik EKSte, bu yuzden aktif.
# ikisi ayni anda yazarsa ayni raporu iki kez uretir ve replikasyonla cakisir.
# Trafik gecisinden sonra suspend: false yapan bir commit yeterli (ArgoCD uygular).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hive-report
  namespace: hive
  labels:
    app.kubernetes.io/name: hive-report
    app.kubernetes.io/part-of: hive
spec:
  schedule: "*/10 * * * *"
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: hive-report
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70 # postgres imajindaki "postgres" kullanicisi
            runAsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: report
              image: postgres:16-alpine
              # Tek SQL ifadesi: sayim ve toplam ayni anda alinir (eski script iki ayri
              # sorguydu). Hata olursa psql sifirdan farkli cikar, Job "Failed" olur;
              # eski script gibi 0/0 sahte rapor yazilmaz.
              command:
                - psql
                - --no-psqlrc
                - --set=ON_ERROR_STOP=1
                - --command
                - >-
                  INSERT INTO daily_reports (total_products, total_quantity)
                  SELECT COUNT(*), COALESCE(SUM(quantity), 0) FROM products
                  RETURNING id, generated_at, total_products, total_quantity;
              env:
                - name: PGHOST
                  valueFrom: { secretKeyRef: { name: hive-db, key: DB_HOST } }
                - name: PGPORT
                  valueFrom: { secretKeyRef: { name: hive-db, key: DB_PORT } }
                - name: PGDATABASE
                  valueFrom: { secretKeyRef: { name: hive-db, key: DB_NAME } }
                - name: PGUSER
                  valueFrom: { secretKeyRef: { name: hive-db, key: DB_USER } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: hive-db, key: DB_PASSWORD } }
                - name: PGSSLMODE
                  value: require
                - name: PGCONNECT_TIMEOUT
                  value: "10"
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
