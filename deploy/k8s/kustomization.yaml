# ArgoCD bu klasörü izler (deploy/argocd/application.yaml).
# Imaj tag'ini app-ci main'de commit SHA'ya çeker; deploy.sh de aynı alanı kullanır.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pdb.yaml
  - hpa.yaml
  - networkpolicy.yaml
  - report-cronjob.yaml
  # App-of-apps: izleme yigini (kube-prometheus-stack + hive-monitoring) ArgoCD Application olarak
  - ../observability
images:
  - name: hive
    newName: 417732881703.dkr.ecr.eu-central-1.amazonaws.com/hive
    newTag: 9a8365b925ea9eae8e88a3cdd53a6edee0e35090
