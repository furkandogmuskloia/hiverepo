# Terraform'un yazdığı secret JSON'u (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD, DB_SSLMODE)
# olduğu gibi pod ortam değişkenlerine dönüşür. Şifre rotasyonunda 1 saat içinde güncellenir.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: hive-db
  namespace: hive
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: hive-db
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: chem-hive/db
