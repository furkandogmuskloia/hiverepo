name: infra-ci

# Altyapı hattı. Kural: apply SADECE buradan (state bucket'a yalnızca Actions rolü yazabilir).
# PR  : hcl/tf fmt + validate (mock output, kimlik gerekmez) + tflint + trivy + plan (PR'a yorum)
# main: aynı kontroller + run --all apply, "production" environment onayı arkasında.

on:
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:

permissions:
  contents: read

# aynı state üzerinde iki plan/apply çakışmasın
concurrency:
  group: infra-chem
  cancel-in-progress: false

env:
  TF_VERSION: 1.11.4
  TG_VERSION: 1.1.3
  AWS_REGION: eu-central-1
  TG_DIR: infra/chem/eu-central-1
  TG_NON_INTERACTIVE: "true"
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  static:
    name: fmt, validate, lint, misconfig
    runs-on: ubuntu-latest
    env:
      TG_SKIP_OUTPUTS: "true" # bağımlılıklar mock output kullanır, AWS'ye gidilmez
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install terragrunt
        run: |
          curl -sSfL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - name: fmt
        run: |
          terragrunt hcl fmt --check --working-dir infra
          terraform fmt -check -recursive infra/modules
      - name: validate (her unit, backend'siz)
        shell: bash
        run: |
          set -euo pipefail
          for unit in "$TG_DIR"/*/; do
            echo "::group::$unit"
            (cd "$unit" && terragrunt init -backend=false -input=false >/dev/null && terragrunt validate --no-auto-init)
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint (lokal modüller)
        run: |
          tflint --init
          tflint --recursive --chdir infra/modules --format compact
      - name: trivy config (IaC misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: CRITICAL,HIGH
          exit-code: "1"

  plan:
    name: plan
    needs: static
    if: vars.TF_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install terragrunt
        run: |
          curl -sSfL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terragrunt run --all plan
        shell: bash
        working-directory: ${{ env.TG_DIR }}
        run: |
          set -o pipefail
          terragrunt run --all -- plan -no-color -input=false 2>&1 | tee plan.txt
      - name: Plan'ı PR'a yaz
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(`${process.env.TG_DIR}/plan.txt`, 'utf8');
            const body = '### terragrunt plan (chem / eu-central-1)\n```\n' + plan.slice(-60000) + '\n```';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  apply:
    name: apply
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production # repo ayarlarında required reviewer tanımlanmalı
    timeout-minutes: 90 # EKS + RDS Multi-AZ ilk kurulum ~30 dk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install terragrunt
        run: |
          curl -sSfL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 5400
      - name: terragrunt run --all apply
        working-directory: ${{ env.TG_DIR }}
        # Bağımlılık sırası: vpc -> (ecr, rds, eks paralel) -> eks-addons -> gitops-bootstrap
        run: terragrunt run --all -- apply -input=false -auto-approve
